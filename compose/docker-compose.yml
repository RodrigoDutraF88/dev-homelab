networks:
  dev-homelab:
    name: dev-homelab
    driver: bridge

volumes:
  portainer-data:
  postgres-data:
  redis-data:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - label:disable
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro,Z
      - ../infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro,Z
      - ../infrastructure/traefik/certs:/etc/traefik/certs:ro,Z
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  portainer:
    image: portainer/portainer-ce:2.39.5-alpine
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - dev-homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - dev-homelab
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime-kuma.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    # `always`, not the `unless-stopped` every other service uses. On 2026-08-13
    # this container was stopped by hand, and when the Docker daemon restarted
    # hours later every other service came back while this one stayed down —
    # which is precisely what unless-stopped promises: an explicit stop is
    # remembered across daemon restarts. That is the right default for a service
    # you might deliberately take offline, and the wrong one for the thing that
    # records whether everything else is alive. Losing ~11h of metrics is not
    # noticed until you go looking for them. Stopping it on purpose now needs
    # `docker stop prometheus` to be followed by nothing restarting the daemon.
    restart: always
    # Overriding command drops the image defaults, so the console paths have to
    # be repeated alongside the flags we actually care about.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Probes services from the outside rather than reading counters from the inside.
  # node-exporter and cAdvisor answer "how is this machine doing?"; this answers
  # "does this URL actually respond?" — which is the only question the Bookshelf
  # app can be asked, since it ships no /metrics endpoint of its own.
  #
  # It holds no targets: Prometheus supplies the URL per scrape as a query
  # parameter, so adding a service to probe is a change to prometheus.yml, not
  # here. See the blackbox job there for the relabel dance that makes that work.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ../infrastructure/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,Z
    networks:
      - dev-homelab

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    # Reads the host's own CPU, memory, disk and filesystem counters rather than
    # the container's. /proc and /sys are bind-mounted read-only and pointed at
    # with --path.*.
    #
    # These mounts deliberately have no :Z. Relabelling is for config we own —
    # applying it to /proc, /sys or / would rewrite SELinux labels on the host's
    # own filesystem.
    #
    # Known limitation: network metrics report this container's interfaces (eth0),
    # not the host's wifi, because the exporter sits on the bridge network. The
    # network panels of the "Node Exporter Full" dashboard are therefore
    # meaningless; CPU, memory, disk and load are accurate. Fixing it means
    # network_mode: host, which would put :9100 on every host interface — not
    # worth trading the no-published-ports rule for a few graphs.
    #
    # pid: host is required, not decorative: without it the filesystem collector
    # fails with "open /host/proc/1/mountinfo: permission denied" and every disk
    # metric disappears. Verified by running the same image both ways.
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      # Without this, every container's overlay and tmpfs mount is reported as a
      # separate filesystem and the dashboard's disk panels turn into noise.
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - dev-homelab

  # Runs prisma's migrations, then exits. The app below will not start until this
  # has completed successfully, which is the first thing in this stack to actually
  # use the postgres healthcheck rather than just declare one.
  #
  # It borrows the app image because that is where the migration files live
  # (/app/prisma). The prisma CLI itself is a devDependency and is NOT in the
  # runtime image, so npx fetches it at run time — hence `--yes` and the pinned
  # version. It runs as root because the image's `nextjs` user has no writable
  # home for an npm cache.
  bookshelf-migrate:
    image: ghcr.io/rodrigodutraf88/bookshelf-app:1.0.0
    container_name: bookshelf-migrate
    restart: "no"
    user: "0"
    entrypoint: ["npx", "--yes", "prisma@6.6.0", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://bookshelf:${BOOKSHELF_DB_PASSWORD}@postgres:5432/bookshelf
      DIRECT_URL: postgresql://bookshelf:${BOOKSHELF_DB_PASSWORD}@postgres:5432/bookshelf
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-homelab

  bookshelf:
    image: ghcr.io/rodrigodutraf88/bookshelf-app:1.0.0
    container_name: bookshelf
    restart: unless-stopped
    depends_on:
      bookshelf-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Its own role and database inside the shared Postgres — the reason that
      # service was built before the app. DIRECT_URL is the same host here: the
      # split exists for Supabase's pooler, which this stack does not have.
      DATABASE_URL: postgresql://bookshelf:${BOOKSHELF_DB_PASSWORD}@postgres:5432/bookshelf
      DIRECT_URL: postgresql://bookshelf:${BOOKSHELF_DB_PASSWORD}@postgres:5432/bookshelf
      AUTH_SECRET: ${BOOKSHELF_AUTH_SECRET}
      # NextAuth builds OAuth callback URLs from this, and needs to be told to
      # trust the proxy's forwarded headers or it will construct http:// links.
      AUTH_URL: https://bookshelf.${DOMAIN:-localhost}
      AUTH_TRUST_HOST: "true"
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so setting
      # it here only reaches server-side code. The image was built without it.
      NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: ${NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY}
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookshelf.rule=Host(`bookshelf.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.bookshelf.entrypoints=websecure"
      - "traefik.http.services.bookshelf.loadbalancer.server.port=3000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    # Per-container CPU/memory/network/disk. node-exporter answers "how is the
    # machine?", this answers "which container is responsible?".
    security_opt:
      - label:disable
    command:
      # The default housekeeping interval is 1s, which is a lot of continuous CPU
      # on a 2019 laptop for data scraped every 15s anyway.
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      # Container labels become Prometheus label dimensions; this stack's compose
      # labels (all the Traefik routing ones) would balloon cardinality for no use.
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dev-homelab

  grafana:
    image: grafana/grafana:13.1.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-localhost}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro,Z
    networks:
      - dev-homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
