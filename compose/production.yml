# compose/production.yml
# Production overlay — merged on top of docker-compose.yml, never used alone:
#
#   make prod-up        (docker compose -f docker-compose.yml -f production.yml up -d)
#
# Compose merges an overlay per key: `environment` and `labels` merge by key, and
# `volumes` merge by *target* path — which is what lets the traefik.prod.yml line
# below replace the development static config without disturbing the docker.sock,
# dynamic/ or certs/ mounts declared in the base file.
#
# PREREQUISITES, both in .env:
#   DOMAIN=rodrigodutra-homelab.duckdns.org
#   DUCKDNS_TOKEN=<the token from duckdns.org>
#
# Certificates come from Let's Encrypt over a DNS-01 challenge, so nothing is
# exposed to the internet and no port is forwarded — the DuckDNS record points at
# this machine's LAN address, and only the ACME conversation leaves the network.
# There are no per-router changes here: the wildcard certificate is configured
# once on the websecure entryPoint in traefik.prod.yml, and every router inherits
# it. Adding a service later needs no production-specific label at all.
#
# Still to come here: resource limits, once there is a reason to tune them.

volumes:
  acme-data:      # holds acme.json — the issued certificates and the ACME account key

services:
  traefik:
    volumes:
      - ../infrastructure/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro,Z
      - acme-data:/letsencrypt
    environment:
      # Read by the ACME library directly, not by Traefik's static config parser —
      # which is why this works where a TRAEFIK_* variable would be ignored.
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
