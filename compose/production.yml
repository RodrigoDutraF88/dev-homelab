# compose/production.yml
# Production overlay for dev-homelab. Not active yet.
#
# Intended usage once populated:
#   docker compose -f compose/docker-compose.yml -f compose/production.yml \
#     --env-file .env up -d
#
# Planned differences vs. docker-compose.yml:
# - Traefik: enable Let's Encrypt (TLS certificatesResolvers), redirect web -> websecure
# - Restrict the Docker dashboard further / remove debug logging
# - Pin image versions instead of floating tags
# - Add resource limits (cpus / memory) per service
#
# This file intentionally stays empty until TLS is introduced later
# in the roadmap, so the Git history shows exactly when and why
# production concerns were added.
