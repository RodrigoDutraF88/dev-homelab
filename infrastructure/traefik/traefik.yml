# infrastructure/traefik/traefik.yml
# Static Traefik configuration.
# Dynamic routing rules for each service are attached via Docker labels
# (see compose/docker-compose.yml) or via files dropped in ./dynamic/.

api:
  dashboard: true
  insecure: false        # dashboard is only reachable through its own router+auth, not :8080

entryPoints:
  web:
    address: ":80"
    # Everything is TLS now. A router with tls=true only matches TLS connections,
    # so plain :80 requests would 404 without this — they are redirected instead.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  metrics:
    address: ":8082"        # scraped by Prometheus over the shared network; never published to the host

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # every container must opt-in with traefik.enable=true
    network: dev-homelab
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog: {}