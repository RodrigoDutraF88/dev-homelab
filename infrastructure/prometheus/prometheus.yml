# infrastructure/prometheus/prometheus.yml
# Scrape configuration. Targets are addressed by Docker service name on the
# shared dev-homelab network, so nothing here needs a published port.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself — the cheapest way to tell whether it is alive.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Traefik publishes its metrics on the dedicated `metrics` entryPoint (:8082),
  # which is deliberately not in the compose `ports:` block — only containers on
  # this network can reach it. See infrastructure/traefik/traefik.yml.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Host-level metrics: CPU, memory, disk, filesystems, load. This is what the
  # community "Node Exporter Full" dashboard draws from — without this job it has
  # no data at all, however correct the dashboard itself is.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics. cAdvisor is by far the noisiest source here, so the
  # relabel rules below drop the series this homelab has no use for before they
  # ever reach the database — retention is 15d on a laptop disk.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Per-CPU-core breakdowns per container: cores × containers series, and the
      # aggregate container_cpu_usage_seconds_total is what anyone actually graphs.
      - source_labels: [__name__]
        regex: "container_cpu_(user|system)_seconds_total"
        action: drop
      # Per-filesystem-device stats for every container's overlay layer.
      - source_labels: [__name__]
        regex: "container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|sector_reads_total|sector_writes_total)"
        action: drop

  # Blackbox probes. This job is shaped differently from the others: the target
  # list is not what Prometheus connects to. It scrapes blackbox-exporter every
  # time, passing the real URL along as ?target=, and the relabel_configs below
  # are what perform that swap:
  #   1. copy the target URL into the __param_target query parameter
  #   2. keep that URL as the `instance` label, so graphs are labelled by service
  #      rather than by the exporter that happened to probe them
  #   3. overwrite the address actually dialled with the exporter itself
  # Without step 3 Prometheus would try to scrape https://bookshelf...  directly
  # and get HTML instead of metrics.
  #
  # Two targets on purpose. The internal one isolates the app: if it fails, the
  # app is broken. The public one traverses DNS, Traefik and TLS, so if it fails
  # while the internal one passes, the app is fine and the path to it is not.
  # It also yields probe_ssl_earliest_cert_expiry, i.e. certificate expiry
  # monitoring for free — the wildcard renews itself, and this is how I would
  # find out if it ever stopped.
  #
  # The public hostname is written out in full because this file is a bind mount:
  # Compose interpolates variables into the compose file, never into a file it
  # mounts, so ${DOMAIN} would arrive here as four literal characters. Same
  # reason the ACME email is hardcoded in traefik.prod.yml. The consequence is
  # that this target only resolves when DOMAIN is the DuckDNS one; in dev
  # (DOMAIN=localhost) it fails, and the internal probe is the meaningful one.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://bookshelf:3000/login
          - https://bookshelf.rodrigodutra-homelab.duckdns.org/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
